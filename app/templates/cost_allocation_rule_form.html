{% extends "base.html" %}{% block content %}<header class="topbar"><h1>{{ 'Editar' if rule else 'Nova' }} Regra de Rateio</h1></header><section class="panel"><form method="post" action="{{ '/cost-allocation-rules/'~rule.id~'/edit' if rule else '/cost-allocation-rules' }}"><div class="form-grid two-cols"><label><span>Centro</span><select name="cost_center_id" required>{% for center in centers %}<option value="{{ center.id }}" {% if rule and rule.cost_center_id==center.id %}selected{% endif %}>{{ center.name }}</option>{% endfor %}</select></label><label><span>Nome</span><input name="name" required value="{{ rule.name if rule else '' }}"></label><label><span>Categoria</span><input name="category" value="{{ rule.category if rule else '' }}"></label><label><span>Item</span><input name="item" value="{{ rule.item if rule else '' }}"></label><label><span>Método</span><select name="allocation_method">{% for method in ['percentual','valor_fixo','por_quantidade','manual_futuro'] %}<option value="{{ method }}" {% if rule and rule.allocation_method==method %}selected{% endif %}>{{ method }}</option>{% endfor %}</select></label><label><span>Percentual</span><input name="percentage" value="{{ rule.percentage if rule and rule.percentage is not none else '' }}"></label><label><span>Valor fixo</span><input name="fixed_value" value="{{ rule.fixed_value if rule and rule.fixed_value is not none else '' }}"></label><label><span>Vigência inicial</span><input type="date" name="valid_from" required value="{{ rule.valid_from if rule else '' }}"></label><label><span>Vigência final</span><input type="date" name="valid_until" value="{{ rule.valid_until if rule and rule.valid_until else '' }}"></label><label><span>Status</span><select name="status"><option value="ativo">Ativo</option><option value="inativo" {% if rule and rule.status=='inativo' %}selected{% endif %}>Inativo</option></select></label><label><span>Observações</span><input name="notes" value="{{ rule.notes if rule else '' }}"></label></div><button class="btn btn-primary margin-top">Salvar</button></form></section>{% endblock %}
