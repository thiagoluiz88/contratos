{% extends "base.html" %}

{% block content %}
<section class="page-header">
    <div>
        <span class="eyebrow">Segurança</span>
        <h1>Trocar senha</h1>
        <p>Atualize sua senha de acesso ao sistema.</p>
    </div>
</section>

<section class="content-section">
    <div class="form-card">
        {% if error %}
        <div class="form-alert" role="alert">{{ error }}</div>
        {% endif %}
        {% if success %}
        <div class="form-alert success" role="status">{{ success }}</div>
        {% endif %}
        <form method="post" action="/change-password" class="auth-form">
            <label>
                <span>Senha atual</span>
                <span class="auth-input">
                    <input name="current_password" type="password" autocomplete="current-password" required>
                </span>
            </label>
            <label>
                <span>Nova senha</span>
                <span class="auth-input">
                    <input name="new_password" type="password" autocomplete="new-password" required>
                </span>
            </label>
            <label>
                <span>Confirmar nova senha</span>
                <span class="auth-input">
                    <input name="new_password_confirm" type="password" autocomplete="new-password" required>
                </span>
            </label>
            <button class="primary-button" type="submit">Salvar nova senha</button>
        </form>
    </div>
</section>
{% endblock %}
