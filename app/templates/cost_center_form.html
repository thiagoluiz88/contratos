{% extends "base.html" %}{% block content %}<header class="topbar"><h1>{{ 'Editar' if center else 'Novo' }} Centro de Custo</h1></header><section class="panel"><form method="post" action="{{ '/cost-centers/'~center.id~'/edit' if center else '/cost-centers' }}"><div class="form-grid two-cols"><label><span>Nome</span><input name="name" required value="{{ center.name if center else '' }}"></label><label><span>Código</span><input name="code" required value="{{ center.code if center else '' }}"></label><label><span>Status</span><select name="status"><option value="ativo">Ativo</option><option value="inativo" {% if center and center.status=='inativo' %}selected{% endif %}>Inativo</option></select></label><label><span>Observações</span><input name="notes" value="{{ center.notes if center else '' }}"></label></div><button class="btn btn-primary margin-top">Salvar</button></form></section>{% endblock %}
